            type: boolean
            example: false
        - in: query
          name: colors
          description: Whether to add HTML coloring or not. Defaults to false (no color).
          schema:
            type: boolean
            example: false
        - in: query
          name: raw
          description: Whether to disable ANSI stripping or not. Defaults to false (no ANSI stripping).
