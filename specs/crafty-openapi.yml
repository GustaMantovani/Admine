  /api/v2/servers/{server_id}/files/upload:
    post:
      tags:
      - Files
      summary: Upload a file to the server
      operationId: uploadServerFile
      description: |-
        Requires FILES. Any file type. Extra header `location`: destination folder relative to the server root (`.` or empty for the root). A failed validation answers 400 `NOT_AUTHORIZED`.

        **Crafty 4.11 bug:** the free-space check runs before the destination folder is created, so uploading into a folder that does not exist yet answers 500 (`FileNotFoundError`) until that folder is created.

        Uploads use custom headers, not multipart.

        **Single request:** send the whole file as the body without the `chunked` header.

        **Chunked** (what the web panel does, 10 MiB chunks):
        1. Handshake: `chunked: true`, `fileId`, `fileName`, `fileSize`, `totalChunks`, `location` (where the operation defines it), no `chunkId`, empty body → `{"status":"ok","data":{"file-id":...}}`.
        2. One request per chunk with the chunk as body. **The endpoint is stateless: every request is parsed on its own and nothing from the handshake is remembered.** Each chunk request must therefore repeat all required headers of this operation (`chunked`, `fileId`, `fileName`, and `location` where defined) together with `chunkId` (0-based), `chunkHash` (SHA-256 hex of the chunk) and `totalChunks`; send `fileSize` as well to keep the free-space check (and, on admin uploads, the image-size cap) active. Omitting `chunked` makes the server treat the chunk as a complete non-chunked upload and overwrite the destination. The response body reports `status: "partial"` while chunks are still missing and `status: "completed"` once every chunk arrived. These are values returned by the server in the response JSON, not headers the client sends. Chunks may arrive in any order.
      parameters:
      - $ref: '#/components/parameters/ServerId'
      - name: fileId
        in: header
        required: true
        schema:
          type: string
        description: Client-chosen ID for this upload (a UUID). Names the temp folder, so it must be safe as a path segment. Required on every request, including each chunk request.
      - name: fileName
        in: header
        required: true
        schema:
          type: string
        description: Name of the file to write. Required on every request, including each chunk request.
      - name: chunked
        in: header
        required: false
        schema:
          type: string
        description: Any non-empty value turns on the chunked protocol (even `false`). Send it on every request of a chunked upload; omitting it makes that request a single-request upload.
      - name: fileSize
        in: header
        required: false
        schema:
          type: integer
        description: Total file size in bytes. Used for the free-space check and, on admin image uploads, for the `max_image_upload_size_mb` cap. Send it on every request of a chunked upload; omitting it skips the free-space check (and, on admin uploads, the size cap).
      - name: totalChunks
        in: header
        required: false
        schema:
          type: integer
        description: Number of chunks in the upload. Required on every request of a chunked upload; the server compares the number of chunks received so far against it to decide between `partial` and `completed`. Ignored for single-request uploads.
      - name: chunkId
        in: header
        required: false
        schema:
          type: integer
        description: 0-based chunk index. Omit only on the handshake request; required on every chunk request.
      - name: chunkHash
        in: header
        required: false
        schema:
          type: string
        description: Lowercase hex SHA-256 of this chunk's body. Required on every chunk request.
      - name: location
        in: header
        required: true
        schema:
          type: string
        description: Destination folder, relative to the server root. Required on every request, including each chunk request; the file name comes from `fileName`.
      requestBody:
        required: false
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        '200':
          description: Handshake, chunk stored, or upload completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '400':
          description: Not authorized, bad parameters or hash mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadError'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          description: Destination folder does not exist yet (see description). Tornado's default error page is HTML.
          content:
            text/html:
              schema:
                type: string
        '507':
          description: Not enough disk space.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadError'
  /api/v2/servers/{server_id}/files/{file_path}/download:
    get:
      tags:
      - Files
      summary: Download a file or directory
      operationId: downloadServerPath
      description: Requires FILES. Directories are zipped first (needs free space for the copy). `file_path` may contain slashes;
        encode each segment.
      parameters:
      - $ref: '#/components/parameters/ServerId'
      - name: file_path
        in: path
        required: true
        schema:
          type: string
        description: Path relative to the server root, e.g. `world/level.dat`.
        examples:
          file:
            value: server.properties
          nested:
            value: config/paper-global.yml
      responses:
        '200':
          description: File contents, streamed in 4 MiB chunks. No Content-Length is sent.
          headers:
            Content-Disposition:
              description: attachment; filename="<name>"
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          description: Path escapes the server folder.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - TRAVERSAL DETECTED
        '404':
          description: No such path.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - File not found
        '507':
          description: Not enough space to zip the directory.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - Out Of Space
  /api/v2/servers/{server_id}/tasks:
    post:
      tags:
      - Schedules
      summary: Create a schedule
      operationId: createSchedule
      description: 'Requires SCHEDULE. `action` is a server action (`start_server`, `backup_server`, `command`, ...). Use
        `cron_string` or `interval` + `interval_type`; `reaction` makes the task run after its `parent`. The schema marks
        most fields optional, but the scheduler reads them all: send every field listed as required here or Crafty answers
        500 (`KeyError`). Only `parent` and `start_time` get defaults.'
      parameters:
      - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
              required:
              - name
              - enabled
              - action
              - interval
              - interval_type
              - command
              - one_time
              - cron_string
              - delay
            example:
              name: Daily restart
              enabled: true
              action: restart_server
              interval: 1
              interval_type: days
              start_time: 04:00
              command: null
              one_time: false
              cron_string: ''
              delay: 0
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      schedule_id:
                        type:
                        - integer
                        - 'null'
                        description: '`null` when the task is disabled or a `reaction`: the task is saved, but its ID is not
                          returned, and Crafty 4.11 has no route to list a server''s tasks.'
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '405':
          description: Invalid cron string, or `action_id` from another server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: A field the scheduler reads is missing (KeyError).
          content:
            text/plain:
              schema:
                type: string
  /api/v2/servers/{server_id}/tasks/{task_id}:
    get:
      tags:
      - Schedules
      summary: Get a schedule
      operationId: getSchedule
      description: 'Requires SCHEDULE. **No envelope**: the body is the schedule row.'
      parameters:
      - $ref: '#/components/parameters/ServerId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Schedule.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags:
      - Schedules
      summary: Update a schedule
      operationId: patchSchedule
      description: Requires SCHEDULE.
      parameters:
      - $ref: '#/components/parameters/ServerId'
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
            example:
              enabled: false
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '405':
          description: Invalid cron string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Schedules
      summary: Delete a schedule
      operationId: deleteSchedule
      description: Requires SCHEDULE.
      parameters:
      - $ref: '#/components/parameters/ServerId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          description: Not authorized or no such schedule.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - NOT_AUTHORIZED
                      - NO SCHEDULE FOUND
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/servers/{server_id}/tasks/{task_id}/run:
    post:
      tags:
      - Schedules
      summary: Run a schedule now
      operationId: runSchedule
      description: 'Requires SCHEDULE. Optional body `{"cascade": true}` also runs the enabled reaction tasks chained to it.'
      parameters:
      - $ref: '#/components/parameters/ServerId'
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cascade:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          description: Not authorized, invalid JSON or failed to queue.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - NOT_AUTHORIZED
                      - INVALID_JSON
                      - RUN_TASK_FAILED
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/servers/{server_id}/tasks/{task_id}/children:
    get:
      tags:
      - Schedules
      summary: List child tasks
      operationId: getTaskChildren
      description: 'Stub. Always answers 200 with an empty body; Crafty 4.11 does not implement child-task listing.'
      parameters:
      - $ref: '#/components/parameters/ServerId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Empty body.
  /api/v2/servers/{server_id}/webhook:
    get:
      tags:
      - Webhooks
      summary: List webhooks
      operationId: listWebhooks
      description: Requires CONFIG.
      parameters:
      - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    description: Webhooks keyed by ID.
                    additionalProperties:
                      $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
      - Webhooks
      summary: Create a webhook
      operationId: createWebhook
      description: 'Requires CONFIG. Send all 8 fields: the schema only demands 7 and declares a default `color`, but Crafty
        reads every field and answers 500 (`KeyError`) when one is missing.'
      parameters:
      - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWebhook'
              required:
              - webhook_type
              - name
              - url
              - bot_name
              - trigger
              - body
              - color
              - enabled
            example:
              webhook_type: Discord
              name: Status
              url: https://discord.com/api/webhooks/1/abc
              bot_name: Crafty
              trigger:
              - start_server
              - stop_server
              body: '{{server_name}} changed state'
              color: '#005cd1'
              enabled: true
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      webhook_id:
                        type: integer
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          description: A field is missing (`KeyError`), as a traceback.
          content:
            text/plain:
              schema:
                type: string
  /api/v2/servers/{server_id}/webhook/{webhook_id}:
