      properties:
        content:
          type: string
        attributes:
          $ref: '#/components/schemas/FileAttributes'
    UploadResult:
      type: object
      description: |-
        Response body of the upload endpoints. `status` is a field **inside the response JSON**, not a request header: the client never sends `ok`, `partial` or `completed`, it only reads them back. Every successful response (handshake, stored chunk or finished upload) uses HTTP 200, so callers must inspect this field to know what happened.
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - partial
          - completed
          description: |-
            Outcome reported by the server in the response body (never sent by the client).
            - `ok`: the handshake was accepted and the upload session was created; no file bytes were received yet.
            - `partial`: one chunk was stored, but other chunks are still missing; keep sending.
            - `completed`: every chunk arrived (or the upload was non-chunked) and the file was written to `location`/`fileName`.
        data:
          type: object
          properties:
            file-id:
              type: string
            message:
              type: string
    UploadError:
      type: object
      properties:
        status:
          type: string
          const: error
        error:
          type: string
        data:
          type: object
          properties:
            message:
              type: string
            chunk_id:
              type: string
  responses:
    Unauthenticated:
      description: Missing, invalid, expired or revoked token (`ACCESS_DENIED`).
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  type: string
                  examples:
                  - ACCESS_DENIED
    NotAuthorized:
      description: Authenticated, but lacking the required permission (`NOT_AUTHORIZED`).
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  type: string
                  examples:
                  - NOT_AUTHORIZED
    BadRequest:
      description: Body is not JSON (`INVALID_JSON`) or does not match the schema (`INVALID_JSON_SCHEMA`).
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - properties:
                error:
                  type: string
                  examples:
                  - INVALID_JSON
                  - INVALID_JSON_SCHEMA
    ServerError:
      description: 'Unhandled exception: the body is the Python traceback as plain text.'
      content:
        text/plain:
          schema:
            type: string
