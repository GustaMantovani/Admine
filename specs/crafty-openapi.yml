                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - PASSKEY_DISABLED
        '403':
          description: Not authorized.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - NOT_AUTHORIZED
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - USER_NOT_FOUND
  /api/v2/users/{user_id}/passkeys/{challenge_id}/verify:
    post:
      tags:
      - Users
      summary: Finish registering a passkey
      operationId: passkeyRegisterVerify
      parameters:
      - $ref: '#/components/parameters/UserIdOrMe'
      - name: challenge_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                credential:
                  type: object
              required:
              - credential
              additionalProperties: false
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
        '400':
          description: Passkeys disabled, invalid body or failed verification.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - PASSKEY_DISABLED
                      - INVALID_JSON
                      - INVALID_JSON_SCHEMA
                      - VERIFICATION_FAILED
        '403':
          description: Not authorized.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
