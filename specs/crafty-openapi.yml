openapi: 3.1.1
info:
  title: Crafty Controller v2 API
  version: 4.11.0
  description: |
    Crafty Controller 4 v2 API, documented from the source of Crafty **4.11.0**.

    ## Authentication
    Send a token as `Authorization: Bearer <token>`, as the `token` query parameter, or as the `token` cookie (checked in
    that order). Get one from `POST /api/v2/auth/login` or create an API key token. A missing or invalid token answers
    **403** `ACCESS_DENIED`. A valid token without the needed permission answers **400** `NOT_AUTHORIZED` on most routes.

    ## Permissions
    Server permissions are 8-bit masks in the order COMMANDS, TERMINAL, LOGS, SCHEDULE, BACKUP, FILES, CONFIG, PLAYERS.
    Crafty permissions are 3-bit masks in the order SERVER_CREATION, USER_CONFIG, ROLES_CONFIG. Superusers pass every check.

    ## Conventions and quirks
    - Success bodies are usually `{"status": "ok", "data": ...}`. Some routes return the payload with no envelope; their
      descriptions say so.
    - Some failures answer HTTP 200 with `"status": "error"`: check `status`, not just the HTTP code.
    - Unhandled exceptions answer 500 with a Python traceback (text/html).
    - Boolean query parameters are true only when the value is exactly `true`.
    - Trailing slashes are optional on every path.

    ## Registered but not implemented
    `GET /api/v2/servers/{server_id}/tasks` (500), `GET /api/v2/servers/{server_id}/tasks/{task_id}/children` (empty 200)
    and `GET /api/v2/users/{user_id}/totp/{totp_id}` (empty 200) exist in the router but do nothing, so they are not listed.
  termsOfService: https://gitlab.com/crafty-controller/crafty-4/-/blob/master/LICENSE
  contact:
    email: info@arcadiatech.org
  license:
    name: GPL-3.0
    identifier: GPL-3.0-only
externalDocs:
  description: Crafty Controller documentation
  url: https://docs.craftycontrol.com
servers:
- url: '{baseUrl}'
  description: Crafty instance
  variables:
    baseUrl:
      default: https://localhost:8443
      description: Scheme, host and port of the panel.
security:
- bearerAuth: []
- tokenQuery: []
- tokenCookie: []
tags:
- name: Meta
  description: API information and request JSON schemas.
- name: Authentication
  description: Login, passkey login and token revocation.
- name: Crafty
  description: Panel configuration, logs, caches and uploads.
- name: Users
  description: Users, API keys, TOTP and passkeys. Most routes accept `@me` as the user ID.
- name: Roles
  description: Roles group servers with a permission mask per server.
- name: Servers
  description: Server lifecycle, stats, logs and console.
- name: Files
  description: Server files. Paths are relative to the server folder.
- name: Backups
  description: Backup configurations and archives.
- name: Schedules
  description: Scheduled tasks (the API calls them tasks).
- name: Webhooks
  description: Discord, Mattermost, Slack and Teams notifications.
- name: Metrics
  description: Prometheus endpoints.
paths:
  /api/v2:
    get:
      tags:
      - Meta
      summary: API version
      operationId: getApiIndex
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      version:
                        type: string
                        examples:
                        - 4.11.0
                      message:
                        type: string
  /api/v2/jsonschema:
    get:
      tags:
      - Meta
      summary: List the JSON schemas Crafty exposes
      operationId: listJsonSchemas
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: array
                    items:
                      type: string
                    examples:
                    - - login
                      - modify_role
                      - create_role
                      - server_patch
                      - new_server
                      - user_patch
                      - new_user
                      - task_patch
  /api/v2/jsonschema/{schema_name}:
    get:
      tags:
      - Meta
      summary: Get a request JSON schema
      operationId: getJsonSchema
      security: []
      parameters:
      - name: schema_name
        in: path
        required: true
        schema:
          type: string
          enum:
          - login
          - modify_role
          - create_role
          - server_patch
          - new_server
          - user_patch
          - new_user
          - task_patch
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    description: JSON Schema (draft 7) with Crafty's private `error`/`fill` keywords.
        '404':
          description: Unknown schema name (`UNKNOWN_JSON_SCHEMA`, message in `info`).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - UNKNOWN_JSON_SCHEMA
  /api/v2/auth/login:
    post:
      tags:
      - Authentication
      summary: Log in with username and password
      operationId: login
      description: |-
        Returns a JWT and also sets it as the `token` cookie. Three failed attempts from one IP within 3 minutes (setting `max_login_attempts`) start a 5 minute cooldown. A body that fails the schema is reported as `INCORRECT_CREDENTIALS` on purpose, to hide the credential rules.

        Crafty accepts a token only if it was issued in a later second than the user's `valid_tokens_from` (set on user creation and by `invalidate_tokens`). A token obtained in that same second is rejected forever with 403, so wait one second after creating a user or revoking tokens before logging in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  maxLength: 20
                  minLength: 3
                  pattern: ^[a-zA-Z0-9_-]+$
                password:
                  type: string
                  minLength: 8
                totp:
                  type: string
                  pattern: ^(\d{6})$
                backup_code:
                  type: string
                  pattern: ^(.{19})$
              required:
              - username
              - password
              additionalProperties: false
            example:
              username: admin
              password: crafty-password
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    $ref: '#/components/schemas/Token'
        '400':
          description: Not JSON, or schema mismatch reported as `INCORRECT_CREDENTIALS`.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - INVALID_JSON
                      - INCORRECT_CREDENTIALS
        '401':
          description: Wrong username, password, TOTP or backup code.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - INCORRECT_CREDENTIALS
        '403':
          description: Account disabled, or password login disabled for this user.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - ACCOUNT_DISABLED
                      - PASSWORD_AUTH_DISABLED
        '429':
          description: Login cooldown active. Extra field `cooldown_time` (mm:ss).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - TOO_MANY_ATTEMPTS
  /api/v2/auth/invalidate_tokens:
    post:
      tags:
      - Authentication
      summary: Revoke every token of the authenticated user
      operationId: invalidateTokens
      description: Sets `valid_tokens_from` to now, so every token issued before, API key tokens included, stops working.
      responses:
        '200':
          description: Tokens revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/auth/passkey/login/options:
    post:
      tags:
      - Authentication
      summary: Start a passkey login
      operationId: passkeyLoginOptions
      description: Returns WebAuthn authentication options plus a `challenge_id`. Omit `username` for a discoverable-credential
        login.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  maxLength: 20
                  minLength: 3
                  pattern: ^[a-zA-Z0-9_-]+$
              additionalProperties: false
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    description: WebAuthn PublicKeyCredentialRequestOptions and `challenge_id`.
        '400':
          description: Passkeys disabled, or invalid body.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - PASSKEY_DISABLED
                      - INVALID_JSON
                      - INVALID_JSON_SCHEMA
  /api/v2/auth/passkey/login/verify:
    post:
      tags:
      - Authentication
      summary: Finish a passkey login
      operationId: passkeyLoginVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_id:
                  type: string
                credential:
                  type: object
              required:
              - challenge_id
              - credential
              additionalProperties: false
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user_id:
                        type: string
        '400':
          description: Passkeys disabled, or body is not JSON.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - PASSKEY_DISABLED
                      - INVALID_JSON
        '401':
          description: Verification failed or body does not match the schema.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - INCORRECT_CREDENTIALS
        '403':
          description: Account disabled.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - ACCOUNT_DISABLED
  /api/v2/crafty/check:
    get:
      tags:
      - Crafty
      summary: Health check
      operationId: craftyCheck
      security: []
      responses:
        '200':
          description: Crafty is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
  /api/v2/crafty/resetPass:
    get:
      tags:
      - Crafty
      summary: Start anti-lockout recovery
      operationId: startAntiLockout
      description: Creates a temporary `anti-lockout-user` valid for 1 hour and prints its credentials in Crafty's terminal.
        Needs no authentication.
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: string
                    examples:
                    - Lockout account has been activated for 1 hour. Please find temporary credentials in the terminal
        '425':
          description: A recovery is already in progress (message in `data`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/crafty/announcements:
    get:
      tags:
      - Crafty
      summary: List announcements not cleared by the user
      operationId: listAnnouncements
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Announcement'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '424':
          description: Could not fetch announcements from Arcadia (message in `data`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Crafty
      summary: Clear an announcement
      operationId: clearAnnouncement
      description: 'An unknown ID answers HTTP 200 with `status: error` and `error: INVALID_DATA`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              additionalProperties: false
              minProperties: 1
      responses:
        '200':
          description: Cleared (`data` is `{}`), or `INVALID_DATA` for an unknown ID.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    status:
                      const: ok
                    data:
                      type: object
                - $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '424':
          description: Could not fetch announcements (message in `data`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/crafty/config:
    get:
      tags:
      - Crafty
      summary: Read config.json (returns roles)
      operationId: getCraftyConfig
      description: Superuser only. Crafty 4.11 returns the **role list** here (same body as `GET /api/v2/roles`), not the
        setting this path names.
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/Ids'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    anyOf:
                    - type: array
                      items:
                        $ref: '#/components/schemas/Role'
                    - type: array
                      items:
                        type: integer
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags:
      - Crafty
      summary: Update config.json
      operationId: patchCraftyConfig
      description: Superuser only. Only the sent keys change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CraftyConfigPatch'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/crafty/config/customize:
    get:
      tags:
      - Crafty
      summary: Read login customization (returns roles)
      operationId: getCraftyCustomize
      description: Superuser only. Crafty 4.11 returns the **role list** here (same body as `GET /api/v2/roles`), not the
        setting this path names.
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/Ids'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    anyOf:
                    - type: array
                      items:
                        $ref: '#/components/schemas/Role'
                    - type: array
                      items:
                        type: integer
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags:
      - Crafty
      summary: Set the login page background
      operationId: patchCraftyCustomize
      description: 'Superuser only. Send both `photo` and `opacity`: the schema allows one, but the handler reads both and
        fails with 500 if one is missing. `login_1.jpg` is the built-in image; any other name is looked up in the custom folder.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photo:
                  type: string
                opacity:
                  type: string
              additionalProperties: false
              minProperties: 1
            example:
              photo: login_1.jpg
              opacity: '100'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      photo:
                        type: string
                      opacity:
                        type: string
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Crafty
      summary: Delete an uploaded login background
      operationId: deleteCraftyCustomize
      description: Superuser only. If it was the active background, Crafty switches back to the default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photo:
                  type: string
              additionalProperties: false
              minProperties: 1
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/crafty/config/servers_dir:
    get:
      tags:
      - Crafty
      summary: Read servers directory (returns roles)
      operationId: getCraftyServersDir
      description: Superuser only. Crafty 4.11 returns the **role list** here (same body as `GET /api/v2/roles`), not the
        setting this path names.
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/Ids'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    anyOf:
                    - type: array
                      items:
                        $ref: '#/components/schemas/Role'
                    - type: array
                      items:
                        type: integer
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags:
      - Crafty
      summary: Move the servers directory
      operationId: patchCraftyServersDir
      description: 'Superuser only. Every server must be stopped. **Not available when Crafty runs in Docker**: it then always
        answers 500.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_dir:
                  type: string
              additionalProperties: false
              minProperties: 1
      responses:
        '200':
          description: Migration started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v2/crafty/config/embed:
    patch:
      tags:
      - Crafty
      summary: Update link-preview (Open Graph) settings
      operationId: patchCraftyEmbed
      description: Superuser only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                og_enabled:
                  type: boolean
                og_title:
                  type: string
                og_description:
                  type: string
                og_image:
                  type: string
                og_color:
                  type: string
              additionalProperties: false
              minProperties: 1
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    description: Echo of the request body.
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      tags:
      - Crafty
      summary: Delete an uploaded embed image
      operationId: deleteCraftyEmbed
      description: Superuser only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                og_image:
                  type: string
              required:
              - og_image
              additionalProperties: false
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/crafty/config/logos:
    patch:
      tags:
      - Crafty
      summary: Select the site logos
      operationId: patchCraftyLogos
      description: Superuser only. Files must already be uploaded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logo_full:
                  type: string
                logo_square:
                  type: string
              additionalProperties: false
              minProperties: 1
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    description: Echo of the request body.
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      tags:
      - Crafty
      summary: Delete uploaded logo files
      operationId: deleteCraftyLogos
      description: Superuser only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logo_full:
                  type: string
                logo_square:
                  type: string
              additionalProperties: false
              minProperties: 1
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/crafty/stats:
    get:
      tags:
      - Crafty
      summary: Host statistics
      operationId: getHostStats
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    $ref: '#/components/schemas/HostStats'
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/crafty/logs/{log_type}:
    get:
      tags:
      - Crafty
      summary: Read Crafty's audit log
      operationId: getCraftyLog
      description: Superuser only. Newest entry first. Only `audit` is implemented; `session` and `schedule` raise NotImplementedError
        (500).
