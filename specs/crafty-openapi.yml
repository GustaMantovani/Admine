  /api/v2/servers/{server_id}/files:
    post:
      tags:
      - Files
      summary: Read a file or list a directory
      operationId: readServerPath
      description: 'Requires FILES. Uses POST because the path goes in the body. The answer is the file content or, for a
        directory, its listing. Sending the directory''s `modified_epoch` returns 304 when nothing changed. Paths are relative
        to the server folder (absolute paths still work but are deprecated). A path that escapes the server folder makes most
        handlers answer 500 (`ValueError: Path traversal detected`) instead of the documented 403.'
      parameters:
      - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: string
                  minLength: 1
                path:
                  type: string
                modified_epoch:
                  type: number
              required:
              - path
              additionalProperties: false
              minProperties: 1
            example:
              path: server.properties
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    anyOf:
                    - $ref: '#/components/schemas/FileContent'
                    - $ref: '#/components/schemas/DirectoryListing'
        '304':
          description: Directory unchanged since `modified_epoch`. Empty body.
        '400':
          description: Invalid body, or file is not UTF-8 text.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - INVALID_JSON
                      - INVALID_JSON_SCHEMA
                      - DECODE_ERROR
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
      - Files
      summary: Write a file
      operationId: writeServerFile
      description: 'Requires FILES. The file must exist (create it with `PUT /files/create`). Send the `modified_epoch` from
        your read: if the file changed since, Crafty answers 409 with an empty body. Without `modified_epoch` the check compares
        against 1.5 seconds after 1970, so every write is rejected unless `overwrite` is `true`. Paths are relative to the
        server folder (absolute paths still work but are deprecated). A path that escapes the server folder makes most handlers
        answer 500 (`ValueError: Path traversal detected`) instead of the documented 403.'
      parameters:
      - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                contents:
                  type: string
                modified_epoch:
                  type: number
                overwrite:
                  type: boolean
              required:
              - path
              - contents
              additionalProperties: false
              minProperties: 1
            example:
              path: server.properties
              contents: |
                motd=Hello
              modified_epoch: 1792865698.2
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      attributes:
                        $ref: '#/components/schemas/FileAttributes'
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: File modified since `modified_epoch`. Empty body.
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Files
      summary: Delete files or directories
      operationId: deleteServerFiles
      description: 'Requires FILES. Directories are deleted recursively. A failure (e.g. missing file) answers 500 with `error:
        SERVER RUNNING` and `error_data: "False"`, whatever the actual cause.'
      parameters:
      - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                file_system_objects:
                  type: array
                  items:
                    type: object
                    properties:
                      filename:
                        type: string
                    required:
                    - filename
                    additionalProperties: false
              required:
              - file_system_objects
              additionalProperties: false
            example:
              file_system_objects:
              - filename: logs/old.log
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Path escapes the server folder, or targets the server root.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - TRAVERSAL DETECTED
        '500':
          description: Deletion failed.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - SERVER RUNNING
