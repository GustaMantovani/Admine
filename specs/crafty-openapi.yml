                    - /static/assets/images/faces-clipart/pic-3.png
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/users/{user_id}/public:
    get:
      tags:
      - Users
      summary: Get a user's public data
      operationId: getUserPublic
      description: '`roles` is always an empty list in Crafty 4.11 (the handler reads it from a dict that never has it).'
      parameters:
      - $ref: '#/components/parameters/UserIdOrMe'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    allOf:
                    - $ref: '#/components/schemas/PublicUser'
                    - type: object
                      properties:
                        roles:
                          type: array
                          items:
                            $ref: '#/components/schemas/Role'
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/users/{user_id}/key:
    get:
      tags:
      - Users
      summary: List a user's API keys
      operationId: listApiKeys
      description: Own keys, or any user's for superusers.
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '400':
          description: Not authorized.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - NOT AUTHORIZED
        '403':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags:
      - Users
      summary: Create an API key
      operationId: createApiKey
      description: Creates a key (this route uses PATCH for creation). All four fields are required in practice. Get a token
        for the key with `GET /api/v2/users/{user_id}/key/{key_id}`.
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                server_permissions_mask:
                  type: string
                  pattern: ^[01]{8}$
                crafty_permissions_mask:
                  type: string
                  pattern: ^[01]{3}$
                full_access:
                  type: boolean
              additionalProperties: false
              minProperties: 1
              required:
              - name
              - server_permissions_mask
              - crafty_permissions_mask
              - full_access
            example:
              name: admine
              server_permissions_mask: '11111111'
              crafty_permissions_mask: '000'
              full_access: true
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
        '400':
          description: Invalid body, unknown user or not authorized.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - INVALID_JSON
                      - INVALID_JSON_SCHEMA
                      - USER NOT FOUND
                      - NOT AUTHORIZED
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/users/{user_id}/key/{key_id}:
    get:
      tags:
      - Users
      summary: Generate a token for an API key
      operationId: createApiKeyToken
      description: Each call issues a new JWT tied to the key. The `user_id` path segment is ignored; ownership is checked
        on the key.
      parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/KeyId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: string
                    description: JWT
        '400':
          description: Key of another user without superuser.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - NOT AUTHORIZED
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          description: 'Unknown key ID: the lookup raises before the `INVALID DATA` check.'
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags:
      - Users
      summary: Delete an API key
      operationId: deleteApiKey
      parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/KeyId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      id:
                        type: string
        '400':
          description: Unknown key or not authorized.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - INVALID DATA
                      - NOT AUTHORIZED
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/users/{user_id}/totp:
    get:
      tags:
      - Users
      summary: List a user's TOTP methods
      operationId: listTotp
      description: 'Only numeric IDs: `@me` is not routed here.'
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        id:
                          type: string
        '403':
          description: Not authorized to view this user (403 here, not 400).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - NOT_AUTHORIZED
                      - ACCESS_DENIED
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - USER_NOT_FOUND
    post:
      tags:
      - Users
      summary: Start adding a TOTP method
      operationId: createTotp
      description: Creates a pending TOTP secret kept in memory until verified with `POST .../totp/{totp_id}/verify`.
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      otp:
                        type: object
                        properties:
                          id:
                            type: string
                          totp_secret:
                            type: string
                            description: Base32 secret for the authenticator app.
                          user_id:
                            type: integer
                          username:
                            type: string
                          iat:
                            type: string
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - USER_NOT_FOUND
  /api/v2/users/{user_id}/totp/{totp_id}/verify:
    post:
      tags:
      - Users
      summary: Verify and save a pending TOTP method
      operationId: verifyTotp
      description: Saves the TOTP method if the code matches. Missing backup codes are then created for the **caller**, not
        for `user_id`, and returned once.
      parameters:
      - $ref: '#/components/parameters/UserIdOrMe'
      - $ref: '#/components/parameters/TotpId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                totp:
                  type: integer
              additionalProperties: false
              minProperties: 1
            example:
              name: Phone
              totp: 123456
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      backup_codes:
                        type: array
                        items:
                          type: string
                          examples:
                          - ABCD-EFGH-IJKL-MNOP
        '400':
          description: Invalid body or wrong code.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - INVALID_JSON
                      - INVALID_JSON_SCHEMA
                      - NOT AUTHORIZED
        '403':
          description: Not authorized for this user.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - NOT_AUTHORIZED
  /api/v2/users/{user_id}/totp/{totp_id}:
    delete:
      tags:
      - Users
      summary: Delete a TOTP method
      operationId: deleteTotp
      description: 'Refused when it is the last method and MFA is required (superMFA for superusers, or a role with `mfa_required`).
        Use the numeric ID: with `@me` Crafty 4.11 fails with 500.'
      parameters:
      - $ref: '#/components/parameters/UserIdOrMe'
      - $ref: '#/components/parameters/TotpId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          description: Sent with `@me` as user ID.
          content:
            text/plain:
              schema:
                type: string
  /api/v2/users/{user_id}/totp/recovery/renew:
    get:
      tags:
      - Users
      summary: Regenerate backup codes
      operationId: renewBackupCodes
      description: Replaces every backup code. Despite being a GET, it changes state.
      parameters:
      - $ref: '#/components/parameters/UserIdOrMe'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      backup_codes:
                        type: array
                        items:
                          type: string
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          description: The user has no TOTP method.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - NOT AUTHORIZED
  /api/v2/users/{user_id}/passkeys:
