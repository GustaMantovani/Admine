          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
      - Servers
      summary: Create or import a server
      operationId: createServer
      description: 'Requires SERVER_CREATION. `create_type` picks which `*_create_data` object is required, and `monitoring_type`
        which `*_monitoring_data` object is required. `create_type: custom` is not implemented in Crafty 4.11 and answers
        503.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewServer'
            examples:
              java:
                summary: Download a Paper JAR
                value:
                  name: My Server
                  monitoring_type: minecraft_java
                  minecraft_java_monitoring_data:
                    host: 127.0.0.1
                    port: 25565
                  create_type: minecraft_java
                  minecraft_java_create_data:
                    create_type: download_jar
                    download_jar_create_data:
                      category: mc_java_servers
                      type: paper
                      version: 1.21.4
                      mem_min: 1
                      mem_max: 2
                      server_properties_port: 25565
                      agree_to_eula: true
              bedrock:
                summary: Download the Bedrock server
                value:
                  name: Bedrock
                  monitoring_type: minecraft_bedrock
                  minecraft_bedrock_monitoring_data:
                    host: 127.0.0.1
                    port: 19132
                  create_type: minecraft_bedrock
                  minecraft_bedrock_create_data:
                    create_type: download_exe
                    download_exe_create_data:
                      agree_to_eula: true
              hytale:
                summary: Download the Hytale server
                value:
                  name: Hytale
                  monitoring_type: hytale
                  hytale_monitoring_data:
                    host: 127.0.0.1
                    port: 5520
                  create_type: hytale
                  hytale_create_data:
                    create_type: download_exe
                    download_exe_create_data:
                      agree_to_eula: true
                      mem_min: 1
                      mem_max: 2
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      new_server_id:
                        type: string
                      new_server_uuid:
                        type: string
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '405':
          description: Port outside 1-65535.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - DATA CONSTRAINT FAILED
        '503':
          description: Creation failed, e.g. unknown version in the catalog.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - Could not create server
