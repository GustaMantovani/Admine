components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tokenQuery:
      type: apiKey
      in: query
      name: token
    tokenCookie:
      type: apiKey
      in: cookie
      name: token
  parameters:
    ServerId:
      name: server_id
      in: path
      required: true
      description: Server ID (UUID).
      schema:
        type: string
        pattern: ^[a-z0-9-]+$
        examples:
        - e0f32910-6af5-4b3c-b406-0bcac3447310
    UserId:
      name: user_id
      in: path
      required: true
      description: Numeric user ID.
      schema:
        type: integer
        examples:
        - 1
    UserIdOrMe:
      name: user_id
      in: path
      required: true
      description: Numeric user ID, or `@me` for the authenticated user.
      schema:
        type: string
        pattern: ^([0-9]+|@me)$
        examples:
        - '@me'
        - '1'
    RoleId:
      name: role_id
      in: path
      required: true
      schema:
        type: integer
        examples:
        - 1
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: integer
        examples:
        - 1
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        type: integer
        examples:
        - 1
    BackupId:
      name: backup_id
      in: path
      required: true
      description: Backup configuration ID (UUID).
      schema:
        type: string
        pattern: ^[a-z0-9-]+$
    KeyId:
      name: key_id
      in: path
      required: true
      description: API key ID.
      schema:
        type: integer
        examples:
        - 1
    TotpId:
      name: totp_id
      in: path
      required: true
      description: TOTP method ID (UUID).
      schema:
        type: string
        pattern: ^[a-z0-9-]+$
    Ids:
      name: ids
      in: query
      required: false
      description: When `true`, return only IDs. Any other value is treated as false.
      schema:
        type: boolean
        default: false
  schemas:
    Error:
      type: object
      description: Error envelope. Most errors use `error` + `error_data`; a few use `info` or `data`.
      required:
      - status
      properties:
        status:
          type: string
          const: error
        error:
          type: string
          examples:
          - NOT_AUTHORIZED
        error_data:
          description: Usually a message string; some handlers send an object or null.
          examples:
          - Insufficient permissions
        info:
          type: string
        data: {}
    StatusOk:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ok
    Token:
      type: object
      required:
      - token
      - user_id
      properties:
        token:
          type: string
          description: JWT. Also set as the `token` cookie.
        user_id:
          type: string
          examples:
          - '1'
        page:
          type: string
          examples:
          - /panel/dashboard
        warning:
          type: string
          description: Present when a backup code was consumed.
    Server:
      type: object
      description: Server row as stored by Crafty.
      properties:
        server_id:
          type: string
        created:
          type: string
          examples:
          - '2026-10-24T17:41:07.143969'
        server_name:
          type: string
        path:
          type: string
        executable:
          type: string
        log_path:
          type: string
        execution_command:
          type: string
        auto_start:
          type: boolean
        auto_start_delay:
          type: integer
        crash_detection:
          type: boolean
        stop_command:
          type: string
        executable_update_url:
          type: string
        server_ip:
          type: string
        server_port:
          type: integer
        logs_delete_after:
          type: integer
        type:
          type: string
          examples:
          - minecraft-java
          - minecraft-bedrock
          - hytale
          - steam_cmd
        show_status:
          type: boolean
        created_by:
          type: integer
        shutdown_timeout:
          type: integer
        ignored_exits:
          type: string
          description: Comma-separated exit codes.
        app_id:
          type:
          - integer
          - 'null'
          description: Steam app ID (SteamCMD servers).
        count_players:
          type: boolean
        update_watcher:
          type: boolean
    ServerDetail:
      allOf:
      - $ref: '#/components/schemas/Server'
      - type: object
        properties:
          status:
            type: object
            properties:
              update_available:
                type: boolean
              updating:
                type: boolean
              backing_up:
                type: boolean
              last_backup:
                type: boolean
                description: True when the last backup failed.
    ServerStats:
      type: object
      description: Latest stats row. While the server is offline Crafty stores Python's `False` as the string "False" in text
        fields (started, players, desc, version, int_ping_results).
      properties:
        stats_id:
          type: integer
        created:
          type: string
        server_id:
          $ref: '#/components/schemas/Server'
        started:
          type: string
          examples:
          - '2026-10-24 15:44:05'
          - 'False'
        running:
          type: boolean
        cpu:
          type: number
        mem:
          type:
          - number
          - string
          description: Number when offline, human-readable string (e.g. "42.2MB") when running.
        mem_percent:
          type: number
        world_name:
          type: string
        world_size:
          type: string
          examples:
          - 221.7MB
        server_port:
          type: integer
        int_ping_results:
          type: string
        online:
          type: integer
        max:
          type: integer
        players:
          type: string
          description: Python list literal of player names, or "False".
        desc:
          type: string
        icon:
          type:
          - string
          - 'null'
          description: Base64 PNG favicon.
        version:
          type: string
        updating:
          type: boolean
        waiting_start:
          type: boolean
        crashed:
          type: boolean
        importing:
