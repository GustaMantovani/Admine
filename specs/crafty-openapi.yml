      - name: log_type
        in: path
        required: true
        schema:
          type: string
          enum:
          - audit
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'
