  /api/v2/servers/{server_id}/action/{action}:
    post:
      tags:
      - Servers
      summary: Run a server action
      operationId: runServerAction
      description: Requires COMMANDS. Actions are queued, so `ok` means accepted. `clone_server` also needs server creation
        permission and the server stopped. `backup_server` needs the backup configuration ID as `action_id`. Any other lowercase
        `[a-z_]+` value is sent to the console as a command.
      parameters:
      - $ref: '#/components/parameters/ServerId'
      - name: action
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z_]+$
          examples:
          - start_server
          - stop_server
          - restart_server
          - kill_server
          - backup_server
          - update_executable
          - clone_server
          - eula
        description: One of `start_server`, `stop_server`, `restart_server`, `kill_server`, `backup_server`, `update_executable`,
          `clone_server`, `eula`.
      responses:
        '200':
          description: Queued. `clone_server` returns `new_server_id`; a clone over the creation limit answers 200 with `SERVER_LIMIT_REACHED`.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/StatusOk'
                - type: object
                  properties:
                    status:
                      const: ok
                    data:
                      type: object
                      properties:
                        new_server_id:
                          type: string
                - $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: Cannot clone a running server.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - Server Running!
  /api/v2/servers/{server_id}/action/{action}/{action_id}:
    post:
      tags:
      - Servers
      summary: Run a server action
      operationId: runServerActionWithId
      description: Requires COMMANDS. Actions are queued, so `ok` means accepted. `clone_server` also needs server creation
        permission and the server stopped. `backup_server` needs the backup configuration ID as `action_id`. Any other lowercase
        `[a-z_]+` value is sent to the console as a command.
      parameters:
      - $ref: '#/components/parameters/ServerId'
      - name: action
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z_]+$
          examples:
          - start_server
          - stop_server
          - restart_server
          - kill_server
          - backup_server
          - update_executable
          - clone_server
          - eula
        description: One of `start_server`, `stop_server`, `restart_server`, `kill_server`, `backup_server`, `update_executable`,
          `clone_server`, `eula`.
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9-]+$
        description: Backup configuration ID for `backup_server`.
      responses:
        '200':
          description: Queued. `clone_server` returns `new_server_id`; a clone over the creation limit answers 200 with `SERVER_LIMIT_REACHED`.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/StatusOk'
                - type: object
                  properties:
                    status:
                      const: ok
                    data:
                      type: object
                      properties:
                        new_server_id:
                          type: string
                - $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: Cannot clone a running server.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - Server Running!
  /api/v2/servers/{server_id}/logs:
    get:
      tags:
      - Servers
      summary: Read server output or log file
      operationId: getServerLogs
      description: Without `file`, returns the in-memory console buffer (empty after a Crafty restart) and needs TERMINAL.
        With `file=true`, reads the last `max_log_lines` of the log file and needs LOGS.
      parameters:
      - $ref: '#/components/parameters/ServerId'
      - name: file
        in: query
        schema:
          type: boolean
          default: false
        description: Read the log file instead of the console buffer.
      - name: log_file
        in: query
        schema:
          type: string
        description: 'With `file=true`: comma-separated log file names (see `/logs/files`) to read instead of the active one.'
      - name: colors
        in: query
        schema:
          type: boolean
          default: false
        description: Add HTML color spans.
      - name: raw
        in: query
        schema:
          type: boolean
          default: false
        description: Keep ANSI codes and skip HTML escaping.
      - name: html
        in: query
        schema:
          type: boolean
          default: false
        description: Has no effect in Crafty 4.11 (the loop never writes back).
      responses:
        '200':
