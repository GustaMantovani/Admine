                $ref: '#/components/schemas/UploadError'
        '500':
          description: Crafty's `import/upload` folder does not exist yet (see description). Tornado's default error page is HTML.
          content:
            text/html:
              schema:
                type: string
        '507':
          description: Not enough disk space.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadError'
  /api/v2/import/archive/select:
    post:
      tags:
      - Crafty
      summary: Browse an uploaded import archive
      operationId: browseImportArchive
      description: 'Lists one level of a zip in Crafty''s `import/upload` folder. Requires server creation permission. Both
        fields are needed in practice (`local_path: ""` for the zip root).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                file_name:
                  type: string
                local_path:
                  type: string
              additionalProperties: false
              minProperties: 1
            example:
              file_name: server.zip
              local_path: ''
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    description: '`top` and `request_path`, plus one key per entry.'
                    properties:
                      top:
                        type: boolean
                      request_path:
                        type: string
                    additionalProperties:
                      type: object
                      properties:
                        path:
                          type: string
                        dir:
                          type: boolean
        '400':
          description: Not authorized or invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Path traversal.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - TRAVERSAL_DETECTED
        '500':
          description: Corrupt zip (JSON), or missing file (traceback).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - Invalid Or Corrupt File
            text/plain:
              schema:
                type: string
                description: Python traceback.
  /api/v2/users:
    get:
      tags:
      - Users
      summary: List users
      operationId: listUsers
      description: Superusers get every user, users with USER_CONFIG the users they manage, anyone else only themselves.
      parameters:
      - $ref: '#/components/parameters/Ids'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    anyOf:
                    - type: array
                      items:
                        $ref: '#/components/schemas/PublicUser'
                    - type: array
                      items:
                        type: integer
        '403':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
      - Users
      summary: Create a user
      operationId: createUser
      description: Requires USER_CONFIG. Only superusers may create superusers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
            example:
              username: player_one
              password: a-strong-password
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                        examples:
                        - '2'
        '400':
          description: Not authorized, invalid body, reserved or taken username, or forbidden superuser/role.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - NOT_AUTHORIZED
                      - INVALID_JSON
                      - INVALID_JSON_SCHEMA
                      - INVALID_USERNAME
                      - USER_EXISTS
                      - INVALID_SUPERUSER_CREATE
                      - INVALID_ROLES_CREATE
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/users/{user_id}:
    get:
      tags:
      - Users
      summary: Get a user
      operationId: getUser
      description: Password and token-validity fields are removed.
      parameters:
      - $ref: '#/components/parameters/UserIdOrMe'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          description: 'Unknown user ID: Crafty fails before its own 404 check.'
          content:
            text/plain:
              schema:
                type: string
    patch:
      tags:
      - Users
      summary: Update a user
      operationId: patchUser
      description: Users cannot disable themselves, and only superusers can change their own superuser flag, permissions or
        roles. `roles` replaces the full role list.
      parameters:
      - $ref: '#/components/parameters/UserIdOrMe'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
            example:
              lang: pt_BR
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          description: Not authorized, invalid body or forbidden change.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - NOT_AUTHORIZED
                      - INVALID_JSON
                      - INVALID_JSON_SCHEMA
                      - INVALID_USERNAME
                      - USER_EXISTS
                      - INVALID_SUPERUSER_MODIFY
                      - INVALID_PERMISSIONS_MODIFY
                      - INVALID_ROLES_MODIFY
                      - INVALID_PASSWORD_MODIFY
        '403':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      tags:
      - Users
      summary: Delete a user
      operationId: deleteUser
      description: Deleting yourself requires the `enable_user_self_delete` setting.
      parameters:
      - $ref: '#/components/parameters/UserIdOrMe'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Unauthenticated'
  /api/v2/users/{user_id}/permissions:
    get:
      tags:
      - Users
      summary: Get a user's Crafty permissions
      operationId: getUserPermissions
      description: Other users require USER_CONFIG.
      parameters:
      - $ref: '#/components/parameters/UserIdOrMe'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    $ref: '#/components/schemas/UserPermissions'
        '400':
          $ref: '#/components/responses/NotAuthorized'
        '403':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - properties:
                    error:
                      type: string
                      examples:
                      - USER_NOT_FOUND
  /api/v2/users/{user_id}/pfp:
    get:
      tags:
      - Users
      summary: Get a user's profile picture URL
      operationId: getUserPfp
      parameters:
      - $ref: '#/components/parameters/UserIdOrMe'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    const: ok
                  data:
                    type: string
