  <style>#search-button {
  position: fixed;
  top: 28px;
  right: 28px;
  z-index: 10;
  display: flex;
  align-items: center;
  background-color: #fff;
  border-radius: 4px;
  border: 1px solid #d9d9d9;
  padding: 4px 12px 4px 8px;
  cursor: pointer;

  .icon {
    font-size: 18px;
    margin-right: 4px;
  }
}

#search-dialog {
  position: fixed;
  top: 10px;
  margin: 0 auto;
  height: 100%;
  background: transparent;
  border: none;

  .auto-complete-list {
    max-height: 265px;
  }
}

#auto-complete {
  background-color: #fff;
}

.auto-complete-list {
  .auto-complete-list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    border-bottom: 1px solid #f0f0f0;
    border-radius: 0;
  }
}

.method-tag {
  display: inline-block;
  padding: 2px 0;
  border-radius: 4px;
  font-size: 11px;
  color: #fff;
  min-width: 54px;
  text-align: center;
  flex-shrink: 0;
}

.endpoint-info {
  display: flex;
  flex-direction: column;
  flex: 1;
  word-break: break-all;
  overflow-wrap: break-word;
  white-space: normal;
}

.endpoint-path {
  font-size: 13px;
}

.endpoint-summary {
  font-size: 11px;
  color: #666;
}

[data-theme=dark] {
  #search-dialog::backdrop {
    background-color: rgba(255, 255, 255, 0.1);
  }

  #search-button {
    background-color: #1f1f1f;
    border: 1px solid #444;
    color: #fff;
  }

  #auto-complete {
    background-color: #1f1f1f;
    border: 1px solid #444;
    color: #fff;
  }

  .auto-complete-list {
    background-color: #1f1f1f;
    border: 1px solid #444;

    .auto-complete-list-item {
      background-color: #1f1f1f;
      border-bottom: 1px solid #444;
      color: #fff;

      &:hover {
        background-color: #333;
      }
    }

    .auto-complete-list-item[aria-selected="true"] {
      background-color: #333;
    }
  }

  .endpoint-path {
    color: #ccc;
  }

  .endpoint-summary {
    color: #888;
  }
}</style>

  <script>window.apiDocs = {"openapi":"3.1.1","info":{"title":"Crafty Controller v2 API","version":"4.11.0","description":"Crafty Controller 4 v2 API, documented from the source of Crafty **4.11.0**.\n\n## Authentication\nSend a token as `Authorization: Bearer <token>`, as the `token` query parameter, or as the `token` cookie (checked in\nthat order). Get one from `POST /api/v2/auth/login` or create an API key token. A missing or invalid token answers\n**403** `ACCESS_DENIED`. A valid token without the needed permission answers **400** `NOT_AUTHORIZED` on most routes.\n\n## Permissions\nServer permissions are 8-bit masks in the order COMMANDS, TERMINAL, LOGS, SCHEDULE, BACKUP, FILES, CONFIG, PLAYERS.\nCrafty permissions are 3-bit masks in the order SERVER_CREATION, USER_CONFIG, ROLES_CONFIG. Superusers pass every check.\n\n## Conventions and quirks\n- Success bodies are usually `{\"status\": \"ok\", \"data\": ...}`. Some routes return the payload with no envelope; their\n  descriptions say so.\n- Some failures answer HTTP 200 with `\"status\": \"error\"`: check `status`, not just the HTTP code.\n- Unhandled exceptions answer 500 with a Python traceback (text/html).\n- Boolean query parameters are true only when the value is exactly `true`.\n- Trailing slashes are optional on every path.\n\n## Registered but not implemented\n`GET /api/v2/servers/{server_id}/tasks` (500), `GET /api/v2/servers/{server_id}/tasks/{task_id}/children` (empty 200)\nand `GET /api/v2/users/{user_id}/totp/{totp_id}` (empty 200) exist in the router but do nothing, so they are not listed.\n","termsOfService":"https://gitlab.com/crafty-controller/crafty-4/-/blob/master/LICENSE","contact":{"email":"info@arcadiatech.org"},"license":{"name":"GPL-3.0","identifier":"GPL-3.0-only"}},"externalDocs":{"description":"Crafty Controller documentation","url":"https://docs.craftycontrol.com"},"servers":[{"url":"{baseUrl}","description":"Crafty instance","variables":{"baseUrl":{"default":"https://localhost:8443 erver treat the chunk as a complete non-chunked upload and overwrite the destination. The response body reports `status: \"partial\"` while chunks are still missing and `status: \"completed\"` once every chunk arrived. These are values returned by the server in the response JSON, not headers the client sends. Chunks may arrive in any order.","parameters":[{"name":"server_id","in":"path","required":true,"description":"Server ID (UUID).","schema":{"type":"string","pattern":"^[a-z0-9-]+$","examples":["e0f32910-6af5-4b3c-b406-0bcac3447310"]}},{"name":"fileId","in":"header","required":true,"schema":{"type":"string"},"description":"Client-chosen ID for this upload (a UUID). Names the temp folder, so it must be safe as a path segment. Required on every request, including each chunk request."},{"name":"fileName","in":"header","required":true,"schema":{"type":"string"},"description":"Name of the file to write. Required on every request, including each chunk request."},{"name":"chunked","in":"header","required":false,"schema":{"type":"string"},"description":"Any non-empty value turns on the chunked protocol (even `false`). Send it on every request of a chunked upload; omitting it makes that request a single-request upload."},{"name":"fileSize","in":"header","required":false,"schema":{"type":"integer"},"description":"Total file size in bytes. Used for the free-space check and, on admin image uploads, for the `max_image_upload_size_mb` cap. Send it on every request of a chunked upload; omitting it skips the free-space check (and, on admin uploads, the size cap)."},{"name":"totalChunks","in":"header","required":false,"schema":{"type":"integer"},"description":"Number of chunks in the upload. Required on every request of a chunked upload; the server compares the number of chunks received so far against it to decide between `partial` and `completed`. Ignored for single-request uploads."},{"name":"chunkId","in":"header","required":false,"schema":{"type":"integer"},"description":"0-b <body>
  <button id="search-button">
    <span class="icon material-symbols-outlined">search</span>
    <span class="text"></span>
  </button>
  <dialog id="search-dialog">
    <input id="auto-complete" autocomplete="off">
  </dialog>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.26.2/swagger-ui-bundle.js" integrity="sha384-4VIVbbtAspop25+wp6W3cA3Mitj0/z1bCuDGEuBGnGlVudCFHrrCfGluiILJCIEd" crossorigin="anonymous"></script>
  <script>// eslint-disable-next-line no-unused-vars
class SearchDialog {
  dialog
  autocomplete

  constructor(dialogId, inputId, openapi) {
    this.dialog = document.getElementById(dialogId)
    if (!this.dialog) {
      throw new Error(`Dialog with id "${dialogId}" not found`)
    }

    this.autocomplete = new autoComplete({
      selector: `#${inputId}`,
      placeHolder: 'Search endpoints',
      data: {
        src: this.filterEndpoints(openapi),
        keys: ['searchKey'],
      },
      searchEngine: 'loose',
      threshold: 0,
      resultsList: {
        maxResults: undefined,
        class: 'auto-complete-list',
        element: (list, data) => {
          if (data.results.length > 0) {
            list.innerHTML = ''
            data.results.forEach((item) => {
              const li = document.createElement('li')
              li.className = 'auto-complete-list-item'
              li.innerHTML = `
              <div class="method-tag method-${item.value.method.toLowerCase()}">${item.value.method}</div>
              <div class="endpoint-info">
                <div class="endpoint-path">${item.value.path}</div>
                <div class="endpoint-summary">${item.value.summary}</div>
              </div>
            `
              list.appendChild(li)
            })
          }
        },
      },
    })

    this.dialog.addEventListener('click', (event) => {
      if (event.target === this.dialog) {
        this.hide()
      }
    })
  }

  on(event, callback) {
    if (event === 'select') {
      this.autocomplete.input.addEventListener('selection', (event) => {
        callback(event.detail.selection.value)
      })
    } else {
      throw new Error(`Unsupported event: ${event}`)
    }
  }

  show() {
    this.autocomplete.input.value = ''
    this.autocomplete.start()
    this.dialog.showModal()
  }

  hide() {
    this.dialog.close()
  }

  filterEndpoints(openapi) {
    const endpoints = []
    const paths = openapi.paths
    for (const path in paths) {
      const methods = Object.keys(paths[path])
      for (const method of methods) {
        if (method === 'parameters') {
          continue
        }
        const summary = paths[path][method].summary || ''
        endpoints.push({
          searchKey: `${method} ${path} ${summary}`,
          method: method.toUpperCase(),
          path,
          operationId: paths[path][method].operationId,
          tag: paths[path][method].tags
            ? paths[path][method].tags[0]
            : 'default',
          summary,
        })
      }
    }
    return endpoints
  }
}
</script>
  <script>const THEMES = ['light', 'dark']
const themeParam = new URLSearchParams(window.location.search).get('theme')
if (THEMES.includes(themeParam)) {
  document.documentElement.setAttribute('data-theme', themeParam)
}

// ref. https://developer.mozilla.org/en-US/docs/Web/API/Navigator/platform#examples
const modifierKeyPrefix =
  navigator.platform.startsWith('Mac') || navigator.platform === 'iPhone'
    ? '⌘' // command key
    : '^' // control key

/* ref. https://swagger.io/docs/open-source-tools/swagger-ui/usage/installation/ */
window.onload = () => {
  window.ui = SwaggerUIBundle({
    spec: window.apiDocs,
    dom_id: '#swagger-ui',
    deepLinking: true,
  })

  const searchButton = document.querySelector('#search-button')
  searchButton.addEventListener('click', () => searchDialog.show())
  searchButton.querySelector('.text').textContent =
    `Search ${modifierKeyPrefix}+K`

  // eslint-disable-next-line no-undef
  const searchDialog = new SearchDialog(
    'search-dialog',
    'auto-complete',
    window.apiDocs,
  )
  searchDialog.on('select', (selection) => {
    const tag = selection.tag
    const operationId = selection.operationId
    const url = new URL(location.href)
    url.hash = `#/${tag}/${operationId}`
    location.href = url.toString()
    searchDialog.hide()

    const opblock = document.querySelector(`#operations-${tag}-${operationId}`)
    opblock.scrollIntoView({
      behavior: 'smooth',
      block: 'start',
    })
    const opblockButton = opblock.querySelector(
      '.opblock-summary-control[aria-expanded="false"]',
    )
    if (opblockButton) {
      opblockButton.click()
    }
  })

  document.addEventListener('keydown', (e) => {
    const isCmdOrCtrl = modifierKeyPrefix === '⌘' ? e.metaKey : e.ctrlKey
    if (isCmdOrCtrl && e.key.toLowerCase() === 'k') {
      searchDialog.show()
      e.preventDefault()
    }
  })
}
</script>
